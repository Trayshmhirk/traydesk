name: CI

# When to run this workflow
on:
  push:
    branches: [main] # Run on pushes to main
  pull_request:
    branches: [main] # Run on PRs targeting main

# Cancel previous runs if new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Lint and Type Check
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v6

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Step 3: Setup pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      # Step 4: Get pnpm store directory (for caching)
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      # Step 5: Cache dependencies
      # Why: Speeds up workflow by reusing downloaded packages
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # Step 6: Install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Step 7: Run ESLint
      # Why: Catch code quality issues
      - name: Run ESLint
        run: pnpm lint

      # Step 8: Run Prettier check
      # Why: Ensure code is formatted consistently
      - name: Check code formatting
        run: pnpm exec prettier --check "**/*.{js,jsx,ts,tsx,json,md,css}"

  # Job 2: Build All Apps
  build:
    name: Build Apps
    runs-on: ubuntu-latest
    needs: lint # Only run if lint passes

    strategy:
      matrix:
        app: [next-app, vue-app]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the specific app
      # Why: Catch build errors before merging
      - name: Build ${{ matrix.app }}
        run: pnpm build:${{ matrix.app == 'next-app' && 'next' || 'vue' }}
